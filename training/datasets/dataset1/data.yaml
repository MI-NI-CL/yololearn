# YOLO 数据集配置文件 - dataset1（识别物体：Gotchard）
# 由标注导出 + train/val 划分后生成

# 数据集根目录（绝对路径，用正斜杠避免 YAML 转义问题）
path: C:/Users/21404/Desktop/gowork/projects/yololearn/training/datasets/dataset1

# 训练集 / 验证集（图片文件夹，YOLO 会自动去同名 labels 文件夹找标注）
